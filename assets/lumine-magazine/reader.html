      background:rgba(92,91,88,.82);
      box-shadow:0 8px 22px rgba(0,0,0,.32);

    .control-btn {

    .control-btn.active { color:var(--accent); background:rgba(255,255,255,.13); }
    .control-btn:disabled { opacity:.24; cursor:default; transform:none; }
    .status {

      text-align:center;

      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;

      white-space:nowrap;
    }
    @media (max-width:700px) {

      .control-btn { width:25px; height:30px; flex-basis:25px; }
      .control-btn svg { width:13px; height:13px; }
      .status { min-width:74px; padding:0 2px; font-size:.5rem; }
    }
    @media (prefers-reduced-motion:reduce) {
      *, *::before, *::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
    }
  </style>
</head>
